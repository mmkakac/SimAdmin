name: Build-OpenWrt-Package

# 只在手动触发时构建（不在 push 时自动跑）。
# 当前只产出 aarch64（ARM64）静态二进制；后续需要 x86_64 / armv7 时把对应矩阵项加回来即可。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（填 auto 则读取 VERSION）'
        required: false
        default: 'auto'
      use_upx:
        description: '使用 UPX 压缩二进制'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  SQLITE3_STATIC: '1'
  LIBSQLITE3_SYS_USE_PKG_CONFIG: '0'

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          ver="${{ inputs.version }}"
          if [ -z "$ver" ] || [ "$ver" = "auto" ]; then ver="$(cat VERSION | tr -d '[:space:]')"; fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "building $ver"

  build:
    name: Build ${{ matrix.arch }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # aarch64：交叉 gcc + crt-static，全静态，不依赖 OpenWrt libc
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            cc: aarch64-linux-gnu-gcc
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            linker: aarch64-linux-gnu-gcc
            extra_apt: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.extra_apt }} file binutils ca-certificates
          if [ "${{ inputs.use_upx }}" = "true" ]; then sudo apt-get install -y upx-ucl || true; fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: openwrt-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: openwrt-${{ matrix.target }}-

      - name: Build backend (fully static)
        env:
          CC_TARGET: ${{ matrix.cc }}
          LINKER_ENV: ${{ matrix.linker_env }}
          LINKER: ${{ matrix.linker }}
          TARGET: ${{ matrix.target }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          export ${LINKER_ENV}="${LINKER}"
          NAME=$(echo "$TARGET" | tr '-' '_')
          export CC_${NAME}="$CC_TARGET"
          cargo build --locked --release --target "$TARGET" -p simadmin
          file "target/$TARGET/release/simadmin"

      - name: Build frontend
        run: |
          cd frontend
          corepack enable
          corepack prepare pnpm@9 --activate || npm i -g pnpm@9
          pnpm install --frozen-lockfile
          pnpm exec vite build

      - name: Assemble OpenWrt bundle
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -e
          OUT="release/simadmin-openwrt-${ARCH}-v${VERSION}"
          mkdir -p "$OUT/bin/$ARCH" "$OUT/files"
          cp "target/$TARGET/release/simadmin" "$OUT/bin/$ARCH/simadmin"
          chmod 755 "$OUT/bin/$ARCH/simadmin"
          if [ "${{ inputs.use_upx }}" = "true" ]; then
            upx --best --lzma "$OUT/bin/$ARCH/simadmin" || true
          fi
          cp -r frontend/dist "$OUT/www"
          cp -r openwrt/files/. "$OUT/files/"
          cp openwrt/install.sh openwrt/Makefile "$OUT/"
          cp LICENSE "$OUT/LICENSE" 2>/dev/null || true
          cp openwrt/README.md "$OUT/README-OpenWrt.md" 2>/dev/null || true
          tar -C release -czf "release/simadmin-openwrt-${ARCH}-v${VERSION}.tar.gz" "simadmin-openwrt-${ARCH}-v${VERSION}"
          sha256sum "release/simadmin-openwrt-${ARCH}-v${VERSION}.tar.gz" | tee "release/simadmin-openwrt-${ARCH}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: simadmin-openwrt-${{ matrix.arch }}
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
          retention-days: 30
